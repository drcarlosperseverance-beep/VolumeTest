name: Build volume test APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp && /tmp/gradle-8.7/bin/gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: VolumeTest-debug, path: app/build/outputs/apk/debug/app-debug.apk }
